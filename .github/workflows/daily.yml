name: Daily DevTrack Update

on:
  schedule:
    - cron: "30 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-daily-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Create daily log
        run: python scripts/daily_update.py

      - name: Commit daily log
        run: |
          git config user.name "DevTrack Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add daily/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update daily developer log"
            git push
          fi